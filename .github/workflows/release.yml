name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Add dependency repos
        run: |
          helm repo add elastic https://helm.elastic.co
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add skywalking https://apache.jfrog.io/artifactory/skywalking-helm
          helm repo add zipkin https://zipkin.io/zipkin-helm
          helm repo add higress https://higress.io/helm-charts
          helm repo add minio https://minio.github.io/operator

      - name: Update dependencies
        run: |
          for category in infrastructure sourced custom; do
            for chart in charts/${category}/*/; do
              if [ -f "${chart}Chart.yaml" ]; then
                echo "Updating dependencies for ${chart}"
                helm dependency update "${chart}" || exit 1
              fi
            done
          done

      - name: Lint charts
        run: |
          failed=0
          for category in infrastructure sourced custom; do
            for chart in charts/${category}/*/; do
              if [ -f "${chart}Chart.yaml" ]; then
                echo "Linting ${chart}"
                if ! helm lint "${chart}"; then
                  echo "FAILED: ${chart}"
                  failed=1
                fi
              fi
            done
          done
          exit $failed

      - name: Package charts
        run: |
          mkdir -p packaged
          for category in infrastructure sourced custom; do
            for chart in charts/${category}/*/; do
              if [ -f "${chart}Chart.yaml" ]; then
                echo "Packaging ${chart}"
                helm package "${chart}" --destination packaged/
              fi
            done
          done

      - name: Generate index
        run: |
          helm repo index packaged/ --url https://ltbah.github.io/helm-charts/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packaged
          publish_branch: pages
