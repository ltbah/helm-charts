filebeat:
  ## 镜像配置（上游 Elastic 格式）
  image: ""
  imageTag: ""
  imagePullPolicy: IfNotPresent

  # -- Filebeat configuration (filebeat.yml)
  filebeatConfig: {}
    # filebeat.yml: |
    #   filebeat.inputs:
    #   - type: log
    #     enabled: true
    #     paths:
    #       - /var/log/*.log
    #   output.elasticsearch:
    #     hosts: ["https://elasticsearch:9200"]
    #   output.logstash:
    #     hosts: ["logstash:5044"]

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "100m"
      memory: "200Mi"
    limits:
      cpu: "500m"
      memory: "500Mi"

  # -- Extra environment variables
  extraEnvs: []
    # - name: LOG_LEVEL
    #   value: "info"

  # -- Node selector for pod assignment
  nodeSelector: {}

  # -- Tolerations for pod assignment
  tolerations: []

  # -- Affinity for pod assignment
  affinity: {}

  # -- Secret mounts (e.g. for TLS certificates)
  secretMounts: []
    # - name: elasticsearch-certs
    #   secretName: elasticsearch-certs
    #   path: /usr/share/filebeat/certs

  # -- Persistence for Filebeat data
  persistence:
    enabled: false
    size: 1Gi

  # -- Readiness probe configuration
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 3
    timeoutSeconds: 5

  # -- Liveness probe configuration
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 20
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 5

  # -- Service configuration
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 5066
        targetPort: 5066

  ## Ingress 配置
  ingress:
    ## 是否启用 Ingress
    enabled: false
    ## Ingress 类名，可选: higress, nginx 等，根据集群 Ingress Controller 选择
    className: ""
    ## 域名后缀，部署时设置，如 --set filebeat.ingress.domainSuffix=example.com
    ## 最终域名格式: {release-name}-{service}.{domainSuffix}
    domainSuffix: ""
    ## 自定义域名（优先级高于 domainSuffix）
    host: ""
    ## TLS（数组格式，上游 Elastic 要求）
    tls: []
    ## Ingress 注解
    annotations: {}
