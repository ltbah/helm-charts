filebeat:
  ## Filebeat 配置
  filebeatConfig:
    filebeat.yml: |
      filebeat.inputs:
        - type: log
          enabled: true
          paths:
            - /var/log/*.log
            - /var/log/app/*.log
          fields_under_root: true
          fields:
            app: java-app

      output.logstash:
        hosts: ["logstash:8080"]

      # 如果不使用 Logstash，直接输出到 Elasticsearch
      # output.elasticsearch:
      #   hosts: ["https://elasticsearch:9200"]

  ## 资源配置
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  ## 安全配置
  secretMounts: []

  ## DaemonSet 配置
  daemonset:
    filebeatConfig:
      filebeat.yml: |
        filebeat.inputs:
          - type: container
            paths:
              - /var/log/containers/*.log
            processors:
              - add_kubernetes_metadata:
                  host: ${NODE_NAME}
                  matchers:
                    - logs_path:
                        logs_path: "/var/log/containers/"
