kafka:
  ## Kafka 监听器配置
  listeners:
    client:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT

  ## KRaft 模式（无需 ZooKeeper）
  kraft:
    enabled: true

  ## Controller 配置
  controller:
    replicaCount: 3
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

  ## Broker 配置
  broker:
    replicaCount: 3
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

  ## 服务配置
  service:
    type: ClusterIP
    ports:
      client: 9092

  ## metrics 监控
  metrics:
    enabled: false
