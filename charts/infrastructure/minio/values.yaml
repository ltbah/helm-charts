minio:
  ## Ingress 配置
  ingress:
    enabled: false
    ## Ingress 类名，可选: higress, nginx 等
    className: ""
    ## 域名后缀，如 --set minio.ingress.domainSuffix=example.com
    domainSuffix: ""
    ## 自定义域名（优先级高于 domainSuffix）
    host: ""
    tls:
      enabled: false
      secretName: ""
    annotations: {}

operator:
  ## ------------------------------------------------------------------
  ## MinIO Operator 开关
  ## ------------------------------------------------------------------
  enabled: true

  ## ------------------------------------------------------------------
  ## Operator 副本数
  ## ------------------------------------------------------------------
  replicaCount: 2

  ## ------------------------------------------------------------------
  ## 容器资源
  ## ------------------------------------------------------------------
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  ## ------------------------------------------------------------------
  ## Service
  ## ------------------------------------------------------------------
  service:
    type: ClusterIP
    ports:
      http: 9090

  ## ------------------------------------------------------------------
  ## 节点调度
  ## ------------------------------------------------------------------
  nodeSelector: {}
  tolerations: []
  affinity: {}

  ## ------------------------------------------------------------------
  ## 额外环境变量
  ## ------------------------------------------------------------------
  extraEnvVars: []
  #  - name: TZ
  #    value: "Asia/Shanghai"

  ## ------------------------------------------------------------------
  ## Pod 标注与标签
  ## ------------------------------------------------------------------
  podAnnotations: {}
  podLabels: {}

tenant:
  ## ------------------------------------------------------------------
  ## MinIO Tenant 开关
  ## ------------------------------------------------------------------
  enabled: true

  ## ------------------------------------------------------------------
  ## Tenant 名称
  ## ------------------------------------------------------------------
  name: minio-tenant

  ## ------------------------------------------------------------------
  ## 认证配置
  ## ------------------------------------------------------------------
  secrets:
    ## [REQUIRED] MinIO Access Key，必须设置
    accessKey: ""
    ## [REQUIRED] MinIO Secret Key，必须设置
    secretKey: ""

  ## ------------------------------------------------------------------
  ## 存储池配置
  ## ------------------------------------------------------------------
  pools:
    - name: pool-0
      servers: 4
      volumesPerServer: 1
      size: 10Gi
      storageClassName: ""

  ## ------------------------------------------------------------------
  ## 服务暴露
  ## ------------------------------------------------------------------
  expose:
    type: ClusterIP
    ports:
      api: 9000
      console: 9001

  ## ------------------------------------------------------------------
  ## 容器资源
  ## ------------------------------------------------------------------
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  ## ------------------------------------------------------------------
  ## Ingress
  ## ------------------------------------------------------------------
  ingress:
    enabled: false
    annotations: {}
    #  kubernetes.io/ingress.class: nginx
    #  cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts: []
    #  - host: minio.example.com
    #    paths:
    #      - /
    tls: []
    #  - secretName: minio-tls
    #    hosts:
    #      - minio.example.com

## 全局镜像仓库配置（Bitnami 镜像已迁移至 bitnamilegacy）
global:
  imageRegistry: docker.io/bitnamilegacy
  security:
    allowInsecureImages: true
