mysql:
  ## MySQL 架构模式: standalone 或 replication
  architecture: standalone

  ## 认证配置
  auth:
    ## 必填: root 用户密码
    rootPassword: ""
    ## 必填: 创建的数据库名
    database: "appdb"
    ## 必填: 应用用户名
    username: "appuser"
    ## 必填: 应用用户密码
    password: ""
    ## 复制用户配置（replication 模式下生效）
    replicationUser: "replicator"
    replicationPassword: ""
    ## 是否使用现有 Secret
    existingSecret: ""

  ## Primary 节点配置
  primary:
    ## 节点亲和性配置
    affinity: {}
    ## 注解
    annotations: {}
    ## 额外环境变量
    extraEnvVars: []
    ## 额外环境变量 ConfigMap
    extraEnvVarsCM: ""
    ## 额外环境变量 Secret
    extraEnvVarsSecret: ""
    ## 额外初始化容器
    initContainers: []
    ## 额外 sidecar 容器
    sidecars: []
    ## 容忍度
    tolerations: []
    ## 节点选择器
    nodeSelector: {}
    ## 优先级类名
    priorityClassName: ""
    ## Pod 标签
    podLabels: {}
    ## Pod 注解
    podAnnotations: {}
    ## Pod 安全上下文
    podSecurityContext: {}
    ## 容器安全上下文
    containerSecurityContext: {}
    ## 持久化配置
    persistence:
      enabled: true
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 8Gi
      annotations: {}
      ## 使用现有 PVC
      existingClaim: ""
    ## 资源配置
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits: {}
    ## 服务配置
    service:
      type: ClusterIP
      ports:
        mysql: 3306
      annotations: {}
      clusterIP: ""
      loadBalancerIP: ""
      externalTrafficPolicy: ""
    ## 就绪探针
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
    ## 存活探针
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
    ## 启动探针
    startupProbe:
      enabled: false
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 15
      successThreshold: 1
    ## MySQL 配置 (my.cnf)
    configuration: ""
    ## 初始化脚本
    initdbScripts: {}
    ## 初始化脚本 ConfigMap
    initdbScriptsConfigMap: ""

  ## Secondary 节点配置（replication 模式下生效）
  secondary:
    replicaCount: 1
    affinity: {}
    annotations: {}
    extraEnvVars: []
    initContainers: []
    sidecars: []
    tolerations: []
    nodeSelector: {}
    persistence:
      enabled: true
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 8Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits: {}
    service:
      type: ClusterIP
      ports:
        mysql: 3306

  ## Ingress 配置（支持 Higress 网关）
  ingress:
    ## 是否启用 Ingress
    enabled: false
    ## Ingress 类名，使用 Higress 时设为 "higress"
    className: "higress"
    ## 域名后缀，部署时通过 --set 设置，如 --set mysql.ingress.domainSuffix=example.com
    ## 最终域名格式: {release-name}-{service}.{domainSuffix}
    domainSuffix: ""
    ## 自定义域名（优先级高于 domainSuffix，设置后忽略 domainSuffix）
    host: ""
    ## TLS 配置
    tls:
      enabled: false
      secretName: ""
    ## Ingress 注解
    annotations: {}

  ## Metrics 配置
  metrics:
    enabled: false
    image:
      repository: bitnami/mysqld-exporter
      tag: ""
      pullPolicy: IfNotPresent
    resources: {}
    service:
      type: ClusterIP
      port: 9104
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.mysql.metrics.service.port }}"

  ## TLS/SSL 配置
  tls:
    enabled: false
    certificatesSecret: ""
    certFilename: ""
    certKeyFilename: ""
    caFilename: ""

  ## NetworkPolicy 配置
  networkPolicy:
    enabled: false

  ## VolumePermissions 初始化配置
  volumePermissions:
    enabled: false

  ## Sysctl 配置
  sysctl:
    enabled: false

## 全局镜像仓库配置（Bitnami 镜像已迁移至 bitnamilegacy）
global:
  imageRegistry: docker.io/bitnamilegacy
  security:
    allowInsecureImages: true
