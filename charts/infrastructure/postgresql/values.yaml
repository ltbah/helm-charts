postgresql:
  ## PostgreSQL 认证配置
  auth:
    postgresPassword: ""
    database: "appdb"
    username: "appuser"
    password: ""

  ## 持久化存储
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  ## 服务配置
  service:
    type: ClusterIP
    port: 5432

  ## metrics 监控
  metrics:
    enabled: false
