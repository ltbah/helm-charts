elasticsearch:
  ## 镜像配置（上游 Elastic 格式）
  image: ""
  imageTag: ""
  imagePullPolicy: IfNotPresent

  ## ------------------------------------------------------------------
  ## 集群配置
  ## ------------------------------------------------------------------
  ## Elasticsearch 集群名称，同一集群内所有节点必须一致
  clusterName: "elasticsearch"

  ## 节点组名称，用于区分 master / data / ingest 等不同角色组
  nodeGroup: "master"

  ## Master 服务名称，默认为 <clusterName>-<nodeGroup>
  ## 多节点组部署时，data/ingest 节点组需指向 master 节点组的服务名
  masterService: ""

  ## ------------------------------------------------------------------
  ## 节点角色（数组格式，上游 Elastic 要求）
  ## ------------------------------------------------------------------
  roles: ["master", "data", "ingest"]

  ## ------------------------------------------------------------------
  ## 副本数
  ## ------------------------------------------------------------------
  replicas: 3

  ## ------------------------------------------------------------------
  ## JVM 堆内存
  ## ------------------------------------------------------------------
  ## 建议设置为容器内存的 50%，且不超过 32g
  esJavaOpts: "-Xms2g -Xmx2g"

  ## ------------------------------------------------------------------
  ## 容器资源
  ## ------------------------------------------------------------------
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

  ## ------------------------------------------------------------------
  ## 持久化存储
  ## ------------------------------------------------------------------
  persistence:
    enabled: true
    ## PVC 上的自定义标签
    labels: {}
    ## PVC 上的自定义注解
    annotations: {}
    volumeClaimTemplate:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 30Gi
      storageClassName: ""

  ## ------------------------------------------------------------------
  ## Service
  ## ------------------------------------------------------------------
  service:
    type: ClusterIP
    ports:
      http: 9200
      transport: 9300

  ## ------------------------------------------------------------------
  ## 节点调度
  ## ------------------------------------------------------------------
  nodeSelector: {}
  tolerations: []
  affinity: {}

  ## ------------------------------------------------------------------
  ## Pod 标注与标签
  ## ------------------------------------------------------------------
  podAnnotations: {}
  podLabels: {}

  ## ------------------------------------------------------------------
  ## 额外环境变量 (value 以 EnvVar 对象列表形式传入)
  ## ------------------------------------------------------------------
  extraEnvs: []
  #  - name: TZ
  #    value: "Asia/Shanghai"

  ## ------------------------------------------------------------------
  ## elasticsearch.yml 自定义配置
  ## ------------------------------------------------------------------
  esConfig: {}
  #  elasticsearch.yml: |
  #    node.store.allow_mmap: false
  #    xpack.security.enabled: true

  ## ------------------------------------------------------------------
  ## Keystore 配置
  ## ------------------------------------------------------------------
  ## 引用已存在的 Kubernetes Secret，将其内容加载到 Elasticsearch Keystore
  keystore: []
  #  - secretName: elasticsearch-credentials

  ## ------------------------------------------------------------------
  ## 协议 (http / https)
  ## ------------------------------------------------------------------
  protocol: https

  ## ------------------------------------------------------------------
  ## 安全上下文
  ## ------------------------------------------------------------------
  securityContext:
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    runAsUser: 1000

  ## Pod 级 fsGroup，确保 Elasticsearch 进程对数据目录有写权限
  fsGroup: 1000

  ## ------------------------------------------------------------------
  ## 健康检查 — Readiness
  ## ------------------------------------------------------------------
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 3
    timeoutSeconds: 5

  ## ------------------------------------------------------------------
  ## 健康检查 — Liveness
  ## ------------------------------------------------------------------
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  ## ------------------------------------------------------------------
  ## 健康检查 — Startup (慢启动场景)
  ## ------------------------------------------------------------------
  startupProbe:
    enabled: false
    failureThreshold: 30
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  ## ------------------------------------------------------------------
  ## Ingress 配置
  ## ------------------------------------------------------------------
  ingress:
    ## 是否启用 Ingress
    enabled: false
    ## Ingress 类名，可选: higress, nginx 等，根据集群 Ingress Controller 选择
    className: ""
    ## 域名后缀，部署时设置，如 --set elasticsearch.ingress.domainSuffix=example.com
    ## 最终域名格式: {release-name}-{service}.{domainSuffix}
    domainSuffix: ""
    ## 自定义域名（优先级高于 domainSuffix）
    host: ""
    ## TLS（数组格式，上游 Elastic 要求）
    tls: []
    ## Ingress 注解
    annotations: {}

  ## ------------------------------------------------------------------
  ## Secrets Keystore
  ## ------------------------------------------------------------------
  ## 启用后，将自动从 Elasticsearch Keystore 中挂载安全配置
  secretsKeystoreEnabled: false
