logstash:
  # -- Elasticsearch hosts (required)
  elasticsearchHosts: "https://elasticsearch:9200"

  # -- Number of Logstash replicas
  replicas: 2

  # -- JVM heap size
  heapSize: "1g"

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

  # -- Persistence for Logstash data
  persistence:
    enabled: false
    size: 2Gi
    storageClassName: ""

  # -- Service configuration
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 8080
        targetPort: 8080
      - name: beats
        port: 5044
        targetPort: 5044

  # -- Logstash pipeline configuration
  logstashPipeline: {}
    # logstash.conf: |
    #   input {
    #     beats {
    #       port => 5044
    #     }
    #   }
    #   filter {
    #     grok {
    #       match => { "message" => "%{COMBINEDAPACHELOG}" }
    #     }
    #   }
    #   output {
    #     elasticsearch {
    #       hosts => ["https://elasticsearch:9200"]
    #       index => "logstash-%{+YYYY.MM.dd}"
    #     }
    #   }

  # -- Node selector for pod assignment
  nodeSelector: {}

  # -- Tolerations for pod assignment
  tolerations: []

  # -- Affinity for pod assignment
  affinity: {}

  # -- Extra environment variables
  extraEnvs: []
    # - name: LOG_LEVEL
    #   value: "info"

  # -- Java options for Logstash
  lsJavaOpts: "-Xms1g -Xmx1g"

  # -- Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 3
    timeoutSeconds: 5

  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 3
    initialDelaySeconds: 60
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 5

  # -- Ingress configuration
  ingress:
    enabled: false
    hosts: []
      # - host: logstash.local
      #   paths:
      #     - path: /
      #       port: 8080
    tls: []
    #  - secretName: logstash-tls
    #    hosts:
    #      - logstash.local
