mongodb:
  ## ------------------------------------------------------------------
  ## Architecture: standalone (单节点) or replicaset (副本集)
  ## ------------------------------------------------------------------
  architecture: standalone

  ## ------------------------------------------------------------------
  ## Authentication
  ## ------------------------------------------------------------------
  auth:
    ## [REQUIRED] root 用户密码，必须设置
    rootPassword: ""
    ## 默认创建的数据库名
    database: "appdb"
    ## 默认创建的普通用户名
    username: "appuser"
    ## [REQUIRED] 普通用户密码，必须设置
    password: ""
    ## 副本集认证密钥 (仅 replicaset 架构)
    replicaSetKey: ""
    ## 使用已有 Secret 替代内建密码 (Secret 需包含对应 key)
    ## 设置后上述密码参数将被忽略
    existingSecret: ""

  ## ------------------------------------------------------------------
  ## ReplicaSet 配置 (仅 architecture=replicaset 时生效)
  ## ------------------------------------------------------------------
  ## 副本集名称
  replicaSetName: "rs0"
  ## 使用 Pod 主机名而非内部 IP 作为副本集成员标识
  replicaSetHostnames: true

  ## ------------------------------------------------------------------
  ## 持久化存储
  ## ------------------------------------------------------------------
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: ""
    existingClaim: ""

  ## ------------------------------------------------------------------
  ## 容器资源
  ## ------------------------------------------------------------------
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  ## ------------------------------------------------------------------
  ## Service
  ## ------------------------------------------------------------------
  service:
    type: ClusterIP
    ports:
      mongodb: 27017

  ## ------------------------------------------------------------------
  ## 节点调度
  ## ------------------------------------------------------------------
  nodeSelector: {}
  tolerations: []
  affinity: {}

  ## ------------------------------------------------------------------
  ## Pod 标注与标签
  ## ------------------------------------------------------------------
  podAnnotations: {}
  podLabels: {}

  ## ------------------------------------------------------------------
  ## 额外环境变量 (value 以 EnvVar 对象列表形式传入)
  ## ------------------------------------------------------------------
  extraEnvVars: []
  #  - name: TZ
  #    value: "Asia/Shanghai"

  ## ------------------------------------------------------------------
  ## 健康检查 — Readiness
  ## ------------------------------------------------------------------
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  ## ------------------------------------------------------------------
  ## 健康检查 — Liveness
  ## ------------------------------------------------------------------
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  ## ------------------------------------------------------------------
  ## Ingress 配置（支持 Higress 网关）
  ## ------------------------------------------------------------------
  ingress:
    ## 是否启用 Ingress
    enabled: false
    ## Ingress 类名，使用 Higress 时设为 "higress"
    className: "higress"
    ## 域名后缀，部署时通过 --set 设置，如 --set mongodb.ingress.domainSuffix=example.com
    ## 最终域名格式: {release-name}-{service}.{domainSuffix}
    domainSuffix: ""
    ## 自定义域名（优先级高于 domainSuffix，设置后忽略 domainSuffix）
    host: ""
    ## TLS 配置
    tls:
      enabled: false
      secretName: ""
    ## Ingress 注解
    annotations: {}

  ## ------------------------------------------------------------------
  ## Metrics (Prometheus Exporter)
  ## ------------------------------------------------------------------
  metrics:
    enabled: false
    service:
      port: 9216

  ## ------------------------------------------------------------------
  ## TLS
  ## ------------------------------------------------------------------
  tls:
    enabled: false
    certificatesSecret: ""

  ## ------------------------------------------------------------------
  ## Arbiter (仅 architecture=replicaset 时生效)
  ## ------------------------------------------------------------------
  arbiter:
    enabled: false

  ## ------------------------------------------------------------------
  ## Hidden 节点 (仅 architecture=replicaset 时生效)
  ## ------------------------------------------------------------------
  hidden:
    enabled: false
    persistence:
      enabled: true
      size: 8Gi
      storageClassName: ""
      existingClaim: ""
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  ## ------------------------------------------------------------------
  ## Volume Permissions (initContainer 修改卷权限)
  ## ------------------------------------------------------------------
  volumePermissions:
    enabled: false
