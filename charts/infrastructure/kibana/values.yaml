kibana:
  ## 镜像配置
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  # -- Elasticsearch hosts (required when no built-in ES)
  elasticsearchHosts: "https://elasticsearch:9200"

  # -- Number of Kibana replicas
  replicas: 1

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

  # -- Service configuration
  service:
    type: ClusterIP
    port: 5601
    annotations: {}

  # -- Persistence for Kibana data
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ""

  ## Ingress 配置
  ingress:
    ## 是否启用 Ingress
    enabled: false
    ## Ingress 类名，可选: higress, nginx 等，根据集群 Ingress Controller 选择
    className: ""
    ## 域名后缀，部署时设置，如 --set kibana.ingress.domainSuffix=example.com
    ## 最终域名格式: {release-name}-{service}.{domainSuffix}
    domainSuffix: ""
    ## 自定义域名（优先级高于 domainSuffix）
    host: ""
    ## TLS 配置
    tls:
      enabled: false
      secretName: ""
    ## Ingress 注解
    annotations: {}

  # -- Node selector for pod assignment
  nodeSelector: {}

  # -- Tolerations for pod assignment
  tolerations: []

  # -- Affinity for pod assignment
  affinity: {}

  # -- Annotations for Kibana pods
  podAnnotations: {}

  # -- Extra labels for Kibana pods
  podLabels: {}

  # -- Extra environment variables
  extraEnvs: []
    # - name: NODE_OPTIONS
    #   value: "--max-old-space-size=2048"

  # -- Kibana configuration (kibana.yml)
  kibanaConfig: {}
    # kibana.yml: |
    #   server.name: kibana
    #   server.host: "0.0.0.0"
    #   elasticsearch.hosts: ["https://elasticsearch:9200"]

  # -- Protocol (http or https)
  protocol: https

  # -- TLS configuration
  tls:
    enabled: false
    certificatesSecret: ""

  # -- Readiness probe configuration
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 3
    timeoutSeconds: 5

  # -- Liveness probe configuration
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 5

  # -- Security context for the pod
  securityContext:
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000

  # -- File system group for volumes
  fsGroup: 1000
