zookeeper:
  ## ------------------------------------------------------------------
  ## 副本数（生产环境建议 ≥ 3，且为奇数）
  ## ------------------------------------------------------------------
  replicaCount: 3

  ## ------------------------------------------------------------------
  ## Authentication
  ## ------------------------------------------------------------------
  auth:
    enabled: false
    ## 客户端认证用户名
    clientUser: ""
    ## [REQUIRED when auth.enabled=true] 客户端认证密码
    clientPassword: ""
    ## 服务端间认证用户名（逗号分隔，对应每个节点，如 "user1,user2,user3"）
    serverUsers: ""
    ## [REQUIRED when auth.enabled=true] 服务端间认证密码（逗号分隔，与 serverUsers 一一对应）
    serverPasswords: ""

  ## ------------------------------------------------------------------
  ## 持久化存储
  ## ------------------------------------------------------------------
  persistence:
    enabled: true
    size: 4Gi
    storageClassName: ""
    existingClaim: ""

  ## ------------------------------------------------------------------
  ## 容器资源
  ## ------------------------------------------------------------------
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  ## ------------------------------------------------------------------
  ## Service
  ## ------------------------------------------------------------------
  service:
    type: ClusterIP
    ports:
      client: 2181
      follower: 2888
      election: 3888

  ## ------------------------------------------------------------------
  ## 节点调度
  ## ------------------------------------------------------------------
  nodeSelector: {}
  tolerations: []
  affinity: {}

  ## ------------------------------------------------------------------
  ## Pod 标注与标签
  ## ------------------------------------------------------------------
  podAnnotations: {}
  podLabels: {}

  ## ------------------------------------------------------------------
  ## 额外环境变量 (value 以 EnvVar 对象列表形式传入)
  ## ------------------------------------------------------------------
  extraEnvVars: []
  #  - name: TZ
  #    value: "Asia/Shanghai"

  ## ------------------------------------------------------------------
  ## 健康检查 — Readiness
  ## ------------------------------------------------------------------
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  ## ------------------------------------------------------------------
  ## 健康检查 — Liveness
  ## ------------------------------------------------------------------
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  ## ------------------------------------------------------------------
  ## Ingress 配置（支持 Higress 网关）
  ## ------------------------------------------------------------------
  ingress:
    ## 是否启用 Ingress
    enabled: false
    ## Ingress 类名，使用 Higress 时设为 "higress"
    className: "higress"
    ## 域名后缀，部署时通过 --set 设置，如 --set zookeeper.ingress.domainSuffix=example.com
    ## 最终域名格式: {release-name}-{service}.{domainSuffix}
    domainSuffix: ""
    ## 自定义域名（优先级高于 domainSuffix，设置后忽略 domainSuffix）
    host: ""
    ## TLS 配置
    tls:
      enabled: false
      secretName: ""
    ## Ingress 注解
    annotations: {}

  ## ------------------------------------------------------------------
  ## Metrics (Prometheus Exporter)
  ## ------------------------------------------------------------------
  metrics:
    enabled: false
    service:
      port: 9141

  ## ------------------------------------------------------------------
  ## TLS
  ## ------------------------------------------------------------------
  tls:
    enabled: false
    ## 包含 tls.crt / tls.key / ca.crt 的 Secret 名称
    certificatesSecret: ""

  ## ------------------------------------------------------------------
  ## Network Policy
  ## ------------------------------------------------------------------
  networkPolicy:
    enabled: false

  ## ------------------------------------------------------------------
  ## Volume Permissions (initContainer 修改卷权限)
  ## ------------------------------------------------------------------
  volumePermissions:
    enabled: false

  ## ------------------------------------------------------------------
  ## 日志级别 (INFO / WARN / ERROR / DEBUG)
  ## ------------------------------------------------------------------
  logLevel: "INFO"
