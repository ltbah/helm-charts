apiVersion: v1
kind: Service
metadata:
  name: {{ include "powerjob.fullname" . }}
  labels:
    {{- include "powerjob.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.ports.akka }}
      targetPort: akka
      protocol: TCP
      name: akka
  selector:
    {{- include "powerjob.selectorLabels" . | nindent 4 }}
