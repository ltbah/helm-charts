# Helm 仓库依赖配置
# 用于 CI 流程中添加依赖仓库
# 注意: Bitnami 已迁移到 OCI registry (oci://registry-1.docker.io/bitnamicharts)
# OCI 依赖不需要 helm repo add，直接在 Chart.yaml 中使用 oci:// URL
repos:
  - name: elastic
    url: https://helm.elastic.co
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: skywalking
    url: https://apache.jfrog.io/artifactory/skywalking-helm
  - name: zipkin
    url: https://zipkin.io/zipkin-helm
  - name: higress
    url: https://higress.io/helm-charts
  - name: minio
    url: https://minio.github.io/operator
